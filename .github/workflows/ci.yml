name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for the default GITHUB_TOKEN. Without this block the token
# takes the repository-wide default, which is a SETTING rather than a property
# of this file: a reader cannot tell from the tree what these jobs can do, and
# a repository whose default is read-write hands both jobs write access to
# contents, issues, packages and deployments for a workflow that only ever
# reads the checkout. Declared here so the answer is in the file, and narrowed
# per job below where anything needs less. codeql.yml already does this.
permissions:
  contents: read

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Actions are pinned to a full commit SHA, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      # The gate protects the MEASUREMENT rather than a product. It fails when
      # routing regresses AND when everything suddenly passes, if the
      # vector-only baseline stops losing, the traps stop trapping, or the
      # corpus stops being selective enough for top-k to discriminate, then
      # the evaluation has stopped measuring and every later green run is
      # worthless. It runs entirely offline; no capture feeds an exit code.
      - name: Routing gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m router.gate

      # The demo is the offline end-to-end path. Running it in CI keeps
      # SAMPLE_RUN.md honest: if the demo breaks, the build breaks.
      - name: Demo (offline mock)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_demo.py

  # Separate job, and it is allowed to be the flaky one. The real-store A/B
  # needs containers, and container startup is the least reliable thing in
  # any CI file. Keeping it out of `test-and-gate` means a slow Elasticsearch
  # boot can never turn the offline suite red, and the badge keeps meaning "the
  # measurement still works" and not "Docker was having a good day". The job above installs none of these drivers and never runs
  # these tests; they skip there with a reason.
  integration-stores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read

    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: frr-local-only
          POSTGRES_DB: frr
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frr"
          --health-interval 5s --health-timeout 5s --health-retries 20

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 59200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integration.txt

      - name: Install dependencies and optional drivers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-integration.txt

      # -rs prints the skip reasons. If a service failed to come up, the log
      # says which one instead of showing a quietly green run of nothing.
      - name: Integration tests against real stores
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_integration.py -v -rs

      - name: Store comparison (A/B)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/compare_stores.py
